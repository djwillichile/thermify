url: https://djwillichile.github.io/thermify/
destination: pkgdown-site

template:
  bootstrap: 5
  bslib:
    primary: "#0B5563"
    link-color: "#0B5563"

home:
  title: "thermify: agroclimatic thermal indices in R"

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]

reference:
  - title: Growing degree-days
