      - densify_diagnostics
      - tempify_available
      - tempify_version
      - hourly_temperatures
      - daylength
  - title: Workflows and periods
    contents:
      - thermify
      - thermify_rast
      - season_days
      - threshold_date
  - title: Spatial data
    contents:
      - study_window
      - worldclim_region
      - worldclim_monthly
      - check_monthly_climate

articles:
  - title: Methods
    navbar: Methods
    contents:
      - gdd-methods
      - chill-models
      - tempify-integration
  - title: Applications
