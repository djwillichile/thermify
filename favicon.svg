<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t">
  <title id="t">thermify icon</title>
  <defs>
    <linearGradient id="mercury" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8702A"/>
      <stop offset="1" stop-color="#F6B55C"/>
    </linearGradient>
  </defs>
  <!-- Sun -->
  <g transform="translate(146 54)">
    <circle r="17" fill="#F6B55C"/>
    <g stroke="#F6B55C" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-27" x2="0" y2="-35"/><line x1="0" y1="27" x2="0" y2="35"/>
      <line x1="-27" y1="0" x2="-35" y2="0"/><line x1="27" y1="0" x2="35" y2="0"/>
      <line x1="-19" y1="-19" x2="-25" y2="-25"/><line x1="19" y1="19" x2="25" y2="25"/>
      <line x1="-19" y1="19" x2="-25" y2="25"/><line x1="19" y1="-19" x2="25" y2="-25"/>
    </g>
  </g>
  <!-- Snowflake -->
  <g transform="translate(52 62)" stroke="#BFE6F0" stroke-width="5" stroke-linecap="round" fill="none">
    <g id="arm"><line x1="0" y1="0" x2="0" y2="-26"/><polyline points="-7,-19 0,-12 7,-19"/></g>
    <use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>
  <!-- Thermometer -->
  <rect x="86" y="36" width="28" height="104" rx="14" fill="#F4F1EA"/>
  <circle cx="100" cy="150" r="26" fill="#F4F1EA"/>
  <rect x="94" y="78" width="12" height="70" rx="6" fill="url(#mercury)"/>
  <circle cx="100" cy="150" r="17" fill="#E8702A"/>
  <g stroke="#0B5563" stroke-width="3" stroke-linecap="round">
    <line x1="114" y1="56" x2="106" y2="56"/><line x1="114" y1="72" x2="106" y2="72"/>
    <line x1="114" y1="88" x2="106" y2="88"/><line x1="114" y1="104" x2="106" y2="104"/>
  </g>
</svg>
