<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 518 600" role="img" aria-labelledby="t">
  <title id="t">thermify hexagon logo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0E6574"/>
      <stop offset="1" stop-color="#0A4E5A"/>
    </linearGradient>
    <linearGradient id="mercury" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#E8702A"/>
      <stop offset="1" stop-color="#F6B55C"/>
    </linearGradient>
  </defs>
  <polygon points="259,10 509,155 509,445 259,590 9,445 9,155" fill="url(#bg)" stroke="#06343C" stroke-width="18" stroke-linejoin="round"/>
  <!-- Sun -->
  <g transform="translate(380 172)">
    <circle r="36" fill="#F6B55C"/>
    <g stroke="#F6B55C" stroke-width="11" stroke-linecap="round">
      <line x1="0" y1="-54" x2="0" y2="-70"/><line x1="0" y1="54" x2="0" y2="70"/>
      <line x1="-54" y1="0" x2="-70" y2="0"/><line x1="54" y1="0" x2="70" y2="0"/>
      <line x1="-38" y1="-38" x2="-49" y2="-49"/><line x1="38" y1="38" x2="49" y2="49"/>
      <line x1="-38" y1="38" x2="-49" y2="49"/><line x1="38" y1="-38" x2="49" y2="-49"/>
    </g>
  </g>
  <!-- Snowflake -->
  <g transform="translate(152 182)" stroke="#BFE6F0" stroke-width="11" stroke-linecap="round" fill="none">
    <g id="arm"><line x1="0" y1="0" x2="0" y2="-54"/><polyline points="-15,-39 0,-25 15,-39"/></g>
    <use href="#arm" transform="rotate(60)"/><use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/><use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
  </g>
  <!-- Thermometer -->
  <rect x="227" y="110" width="64" height="232" rx="32" fill="#F4F1EA"/>
  <circle cx="259" cy="358" r="56" fill="#F4F1EA"/>
  <rect x="245" y="200" width="28" height="150" rx="14" fill="url(#mercury)"/>
  <circle cx="259" cy="358" r="38" fill="#E8702A"/>
  <g stroke="#0B5563" stroke-width="6" stroke-linecap="round">
    <line x1="291" y1="150" x2="273" y2="150"/><line x1="291" y1="184" x2="273" y2="184"/>
    <line x1="291" y1="218" x2="273" y2="218"/><line x1="291" y1="252" x2="273" y2="252"/>
  </g>
  <text x="259" y="487" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="#F4F1EA" letter-spacing="2">thermify</text>
</svg>
